{% extends 'components/base.html' %}
{% load static %}

{% block content %}
  <!-- 로딩 오버레이 -->
  <div id="pageLoadingOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9998; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: opacity 0.4s ease;">
    <div class="text-center">
      <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Loading...</span>
      </div>
      <div style="font-size: 0.85rem; color: #475569; font-weight: 500;">데이터를 불러오는 중...</div>
    </div>
  </div>

  <div class="content">
    <nav class="mb-3" aria-label="breadcrumb">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="#!">계약 관리</a></li>
        <li class="breadcrumb-item active">장비 매출내역</li>
      </ol>
    </nav>

    <div class="mb-9">
      <div class="row g-3 mb-3" style="margin: 0 auto;">
        <div class="col-auto">
          <h2 class="mb-0">장비 매출내역</h2>
        </div>
        <div class="col-auto ms-auto d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-secondary" onclick="resetFilters()">
            <i class="fas fa-filter-circle-xmark me-1"></i>필터 초기화
          </button>
          <button class="btn btn-sm btn-primary" onclick="refreshDeviceRevenue()">
            <i class="fas fa-sync-alt me-1"></i>새로고침
          </button>
        </div>
      </div>

      <!-- Stat bar -->
      <div class="mb-2" id="summaryCards" style="display:flex; align-items:center; flex-wrap:wrap; gap:20px 28px; padding:14px 24px; background:var(--phoenix-card-bg, #fff); border-radius:10px; border:1px solid var(--phoenix-border-color, #e2e8f0);">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="width:8px; height:8px; border-radius:50%; background:rgba(99,102,241,0.6); display:inline-block;"></span>
          <span style="font-size:0.88rem; color:var(--phoenix-tertiary-color, #64748b);">대상 장비</span>
          <span id="stat_devices" style="font-size:1.25rem; font-weight:700; color:var(--phoenix-body-color, #1e293b);">-</span>
        </div>
        <div style="width:1px; height:24px; background:#e2e8f0;"></div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="width:8px; height:8px; border-radius:50%; background:rgba(30,41,59,0.6); display:inline-block;"></span>
          <span style="font-size:0.88rem; color:var(--phoenix-tertiary-color, #64748b);">전체 회원사</span>
          <span id="stat_members" style="font-size:1.25rem; font-weight:700; color:var(--phoenix-body-color, #1e293b);">-</span>
        </div>
        <div style="width:1px; height:24px; background:#e2e8f0;"></div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="width:8px; height:8px; border-radius:50%; background:rgba(59,130,246,0.7); display:inline-block;"></span>
          <span style="font-size:0.88rem; color:var(--phoenix-tertiary-color, #64748b);">스위치</span>
          <span id="stat_switch_cnt" style="font-size:1.05rem; font-weight:700; color:var(--phoenix-body-color, #1e293b);">-</span>
          <span id="stat_switch_rev" style="font-size:0.85rem; font-weight:600; color:#3b82f6;">-</span>
        </div>
        <div style="width:1px; height:24px; background:#e2e8f0;"></div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="width:8px; height:8px; border-radius:50%; background:rgba(239,68,68,0.7); display:inline-block;"></span>
          <span style="font-size:0.88rem; color:var(--phoenix-tertiary-color, #64748b);">방화벽</span>
          <span id="stat_fw_cnt" style="font-size:1.05rem; font-weight:700; color:var(--phoenix-body-color, #1e293b);">-</span>
          <span id="stat_fw_rev" style="font-size:0.85rem; font-weight:600; color:#ef4444;">-</span>
        </div>
        <div style="width:1px; height:24px; background:#e2e8f0;"></div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="width:8px; height:8px; border-radius:50%; background:rgba(16,185,129,0.7); display:inline-block;"></span>
          <span style="font-size:0.88rem; color:var(--phoenix-tertiary-color, #64748b);">월 매출 합계</span>
          <span id="stat_grand_total" style="font-size:1.25rem; font-weight:700; color:#10b981;">-</span>
        </div>
      </div>

      <!-- 데이터센터별 매출 분해 -->
      <div class="mb-3" id="summaryByDc" style="display:flex; align-items:center; flex-wrap:wrap; gap:8px;"></div>

      <div class="card">
        <div class="card-body">
          <table id="deviceRevenueTable" class="table table-sm table-hover" style="width:100%; font-size:0.82rem;">
            <thead class="text-center" style="background:#f8fafc;">
              <tr>
                <th>회원사</th>
                <th>회사명</th>
                <th>데이터센터</th>
                <th>주소</th>
                <th>장비명</th>
                <th>역할</th>
                <th>제조사</th>
                <th>모델</th>
                <th>요금기준</th>
                <th>설명</th>
                <th>월 단가(원)</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

{% endblock %}

{% block scripts %}
<!-- ===============================================-->
<!--    JavaScripts-->
<!-- ===============================================-->
<!-- jQuery 먼저 포함 (다른 스크립트들이 의존) -->
<script src="{% static 'assets/js/jquery-3.6.0.min.js' %}"></script>
<!-- DataTables JS -->
<script src="{% static 'assets/js/datatables.min.js' %}"></script>
<!-- JSZip (Excel export 필수) -->
<script src="{% static 'assets/js/jszip.min.js' %}"></script>
<!-- DataTables Buttons -->
<script src="{% static 'assets/js/dataTables.buttons.min.js' %}"></script>
<script src="{% static 'assets/js/buttons.html5.min.js' %}"></script>
<script src="{% static 'vendors/popper/popper.min.js' %}"></script>
<script src="{% static 'vendors/bootstrap/bootstrap.min.js' %}"></script>
<script src="{% static 'vendors/anchorjs/anchor.min.js' %}"></script>
<script src="{% static 'vendors/is/is.min.js' %}"></script>
<script src="{% static 'vendors/fontawesome/all.min.js' %}"></script>
<script src="{% static 'vendors/lodash/lodash.min.js' %}"></script>
<script src="{% static 'vendors/feather-icons/feather.min.js' %}"></script>
<script src="{% static 'vendors/dayjs/dayjs.min.js' %}"></script>
<script src="{% static 'assets/js/phoenix.js' %}"></script>
<script src="{% static 'assets/js/net_admin/device_revenue.js' %}?v={% now "YmdHis" %}"></script>
{% endblock %}
